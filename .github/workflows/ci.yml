name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: middleware-platform/package-lock.json
      - name: Install dependencies
        working-directory: middleware-platform
        run: npm ci
      - name: Verify trading shell
        working-directory: middleware-platform
        run: npm run verify:trading-shell
      - name: Run tests
        working-directory: middleware-platform
        run: npm test
